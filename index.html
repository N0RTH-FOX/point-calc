<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>ポイント確認用</title>
    <style>
h1{
  font-size: 8rem;

  &::after{
    content: ":";
  }
}
div{
  aspect-
  background: blue;
}
p{
  font-size: 20rem;
  color: #fff;
}
    </style>
  </head>
  <body>
    <h1>現在のポイント</h1>
    <div id="button">
      <p id="point-counter">0</p>
    </div>

    <script>
      const button = document.getElementById("button");
      const pointCounter = document.getElementById("point-counter");
      let point = 0;

      button.addEventListener("click", () => {
        point++;
        pointCounter.innerText = point.toString();
      });
    </script>
  </body>
</html>
