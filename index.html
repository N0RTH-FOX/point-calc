<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>ポイント確認用</title>
    <style>
body{
  display: flex;
  align-items: center;
  justify-content: center;
}
*{
  margin: 0; 
  padding: 0;
}
h1{
  font-size: 7rem;

  &::after{
    content: ":";
  }
}
div{
  display: flex;
  align-items: center;
  justify-content: center;
  aspect-ratio: 1/1;
  background: blue;
  border-radius: 100%;
  height: 30rem;
}
p{
  text-align: center;
  font-weight: bold;
  font-size: 20rem;
  line-height: 30rem;
  color: #fff;
}
    </style>
  </head>
  <body>
    <h1>現在のポイント</h1>
    <div id="button">
      <p id="point-counter">0</p>
    </div>

    <script>
      const button = document.getElementById("button");
      const pointCounter = document.getElementById("point-counter");
      let point = 0;

      button.addEventListener("click", () => {
        point++;
        pointCounter.innerText = point.toString();
      });
    </script>
  </body>
</html>
