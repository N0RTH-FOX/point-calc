<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>ポイント確認用</title>
    <style>
*{
  margin: 0;
  padding: 0;
}
h1{
  padding: .3rem;
  margin: 3rem 0;
  width: 100vw;
  text-align: center;
  font-size: 6.4rem;
}
div{
  margin: 0 calc(50vw - 14.4rem);
  display: flex;
  align-items: center;
  justify-content: center;
  aspect-ratio: 1/1;
  background: #000;
  border-radius: 100%;
  height: 30rem;
}
p{
  text-align: center;
  font-weight: bold;
  font-size: 20rem;
  line-height: 30rem;
  color: #fff;
}
input{
  width: calc(100vw - 10rem);
  font-size: 5rem;
  margin: 1rem 5rem;
}
    </style>
  </head>
  <body>
    <h1>現在のポイント</h1>
    <div id="button">
      <p id="point-counter">0</p>
    </div>
    <input type="password" id="pass-box" placeholder="パスワード">
    <input type="number" id="num-box" placeholder="数値(半角)">


    <script>
const button = document.getElementById("button");
const pointCounter = document.getElementById("point-counter");
const passBox = document.getElementById("pass-box");
const numBox = document.getElementById("num-box");
let point = 0;

button.addEventListener("click",()=>{
  if(passBox.value == "abc"){
    point+=parseInt(numBox.value, 10)
    pointCounter.innerText=point.toString()
}})
    </script>
  </body>
</html>
