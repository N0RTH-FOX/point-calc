<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>ポイント確認用</title>
    <style>
*{
  margin: 0;
  padding: 0;
}
body{
  overflow-x: auto;
  position: sticky;
}

h1{
  padding: calc(7px * .3);
  margin: calc(7px * 3) 0;
  width: 99vw;
  text-align: center;
  font-size: calc(7px * 6.4);
}
p{
  display: block;
  width: 99vw;
  text-align: center;
  font-weight: bold;
  font-size: calc(7px * 20);
  line-height: calc(7px * 30);
  color: #000;
}
input,button{
  width: calc(99vw - calc(7px * 10));
  font-size: calc(7px * 5);
  margin: 1rem calc(7px * 5);
}
    </style>
  </head>
  <body>
    <h1>現在のポイント</h1>
    <p id="point-counter">0</p>
    <input type="password" id="pass-box" placeholder="パスワード">
    <input type="number" id="num-box" placeholder="数値(半角)">
    <button id="button">Submit!</button>


    <script>
const button = document.getElementById("button");
const pointCounter = document.getElementById("point-counter");
const passBox = document.getElementById("pass-box");
const numBox = document.getElementById("num-box");
let point = 0;

if(localStorage.getItem('point') === null){
  point = 0;
}else{
  point = parseInt(localStorage.getItem('point'), 10);
}

pointCounter.innerText=point.toString();

button.addEventListener("click",()=>{
  if(passBox.value == "abc" && numBox.value
!=""){
    point+=parseInt(numBox.value, 10)
    pointCounter.innerText=point.toString()
    passBox.value="";
    numBox.value="";
    localStorage.setItem('point',point);
}})
    </script>
  </body>
</html>
